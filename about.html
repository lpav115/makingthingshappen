<!DOCTYPE html>
<html lang="en">
  <head>

    <meta
      name="description"
      content="Meet the Making Things Happen team — Waterloo alumni Parbir Deol and Luka Pavlesen."

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="logo" href="index.html">
          <img
            class="logo-img"
            src="assets/logos/MTH/mth-logo-horizontal.png"
            alt="Making Things Happen"
            width="480" height="120"
          />
        </a>
        <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html" aria-current="page">About</a></li>
          <li><a href="events/index.html">Events</a></li>
        </ul>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container reveal">

          <!-- PLACEHOLDER – REVIEW: short about intro; keep light — mission lives on Home -->
          <p>Waterloo alumni building nights that help students decide what comes next.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="team-grid">
            <!-- Parbir -->
            <article class="team-card reveal">
              <div class="team-photo">
                <img
                  src="assets/Headshots/parbir.jpg"
                  alt="Parbir Deol"
                  width="800"
                  height="800"
                />
              </div>
              <div class="team-info">
                <h2 class="team-name">Parbir Deol</h2>
                <p class="team-school">Co-Founder</p>
                <div class="employer-logos" aria-label="Past experience">
                  <img src="assets/logos/Other/NBA.svg" alt="NBA" />
                  <img src="assets/logos/Other/TPG.svg" alt="TPG" />
                  <img
                    class="logo-invert"
                    src="assets/logos/Other/moelis.svg"
                    alt="Moelis &amp; Company"
                  />
                </div>
              </div>
            </article>

            <!-- Luka -->
            <article class="team-card reveal">
              <div class="team-photo">
                <img
                  src="assets/Headshots/luka.jpg"
                  alt="Luka Pavlesen"
                  width="800"
                  height="800"
                />
              </div>
              <div class="team-info">
                <h2 class="team-name">Luka Pavlesen</h2>
                <p class="team-school">Co-Founder</p>
                <div class="employer-logos" aria-label="Past experience">
                  <img
                    class="logo-bcg"
                    src="assets/logos/Other/BCG.svg"
                    alt="BCG"
                  />
                  <img
                    class="logo-invert"
                    src="assets/logos/Other/moelis.svg"
                    alt="Moelis &amp; Company"
                  />
                  <img
                    class="logo-invert"
                    src="assets/logos/Other/onex.svg"
                    alt="Onex"
                  />
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <a class="logo" href="index.html">
          <img
            class="logo-img"
            src="assets/logos/MTH/mth-logo-horizontal.png"
            alt="Making Things Happen"
            width="480" height="120"
          />
        </a>
          <!-- PLACEHOLDER – REVIEW: footer tagline -->
          <p class="footer-copy">A non-profit by University of Waterloo alumni.</p>
        </div>
        <p class="footer-contact">
          Contact:
          <!-- PLACEHOLDER – REVIEW: replace with real MTH inbox -->
          <a href="mailto:makingthingshappen2025@gmail.com">makingthingshappen2025@gmail.com</a>
        </p>
      </div>

    <script src="js/main.js"></script>
